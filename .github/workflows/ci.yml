name: CI

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache emsdk
        uses: actions/cache@v5
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('emsdk_manifest.txt') }}

      - name: Install emsdk
        run: |
          if [ ! -d "$HOME/emsdk" ]; then
            git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          cd "$HOME/emsdk"
          ./emsdk install $(cat "$GITHUB_WORKSPACE/emsdk_manifest.txt")
          ./emsdk activate $(cat "$GITHUB_WORKSPACE/emsdk_manifest.txt")

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build & test
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          export EMSDK_PATH="$HOME/emsdk"
          npm test

  test-kokkos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cache emsdk
        uses: actions/cache@v5
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('emsdk_manifest.txt') }}

      - name: Install emsdk
        run: |
          if [ ! -d "$HOME/emsdk" ]; then
            git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          cd "$HOME/emsdk"
          ./emsdk install $(cat "$GITHUB_WORKSPACE/emsdk_manifest.txt")
          ./emsdk activate $(cat "$GITHUB_WORKSPACE/emsdk_manifest.txt")

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Build & test KOKKOS variant
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          export EMSDK_PATH="$HOME/emsdk"
          npm run test:kokkos
