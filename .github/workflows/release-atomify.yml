name: Release atomify flavor

# Publishes lammps.js-atomify: the same code built with PACKAGES=atomify
# (the full LAMMPS package set Atomify's example library needs) plus the
# vendored extra pair styles. Versions stay in lockstep with lammps.js —
# a version bump releases both flavors from their respective workflows.
#
# npm setup (once): the lammps.js-atomify package needs its own Trusted
# Publisher entry on npmjs.com (repo lammps/lammps.js, workflow
# release-atomify.yml).

on:
  push:
    branches:
      - master
    paths:
      - 'package.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check version against npm registry
        id: version_check
        run: |
          PUBLISHED=$(npm view lammps.js-atomify version 2>/dev/null || echo "0.0.0")
          CURR=$(jq -r '.version' package.json)
          echo "published=$PUBLISHED"
          echo "current=$CURR"
          if [ "$PUBLISHED" != "$CURR" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Cache emsdk
        uses: actions/cache@v5
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('emsdk_manifest.txt') }}

      - name: Install emsdk
        run: |
          if [ ! -d "$HOME/emsdk" ]; then
            git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          cd "$HOME/emsdk"
          ./emsdk install $(cat "$GITHUB_WORKSPACE/emsdk_manifest.txt")
          ./emsdk activate $(cat "$GITHUB_WORKSPACE/emsdk_manifest.txt")

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm >= 11.5.1; the npm bundled with
      # node 20 (10.x) has no OIDC support and fails with ENEEDAUTH.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install deps
        run: npm ci

      - name: Build & test (PACKAGES=atomify)
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          export EMSDK_PATH="$HOME/emsdk"
          export PACKAGES=atomify
          npm test

      # This flavor ships the serial module only; dist/cpp/lammps-kokkos.js
      # is the throwing stub from ensure-kokkos-stub.mjs.
      - name: Rename package to lammps.js-atomify
        if: success() && steps.version_check.outputs.changed == 'true'
        run: |
          npm pkg set name=lammps.js-atomify
          npm pkg set description="lammps.js built with the full Atomify LAMMPS package set (RIGID CLASS2 MANYBODY MC MOLECULE GRANULAR KSPACE SHOCK MISC QEQ REAXFF EXTRA-MOLECULE VORONOI COLVARS + moltemplate pair styles)"

      # No emsdk_env sourcing here: it would put emsdk's bundled (old) npm
      # first on PATH, and publishing only needs the already-built dist/.
      - name: Publish package
        if: success() && steps.version_check.outputs.changed == 'true'
        run: npm publish --provenance
        env:
          # setup-node's registry-url writes an .npmrc referencing this
          # variable; it must exist (empty) for OIDC publishing to proceed.
          NODE_AUTH_TOKEN: ""
