name: Release

on:
  push:
    branches:
      - master
    paths:
      - 'package.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version bump
        id: version_check
        run: |
          PREV=$(git show HEAD~1:package.json | jq -r '.version' 2>/dev/null || echo "0.0.0")
          CURR=$(jq -r '.version' package.json)
          echo "previous=$PREV"
          echo "current=$CURR"
          if [ "$PREV" != "$CURR" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Cache emsdk
        uses: actions/cache@v4
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('emsdk_manifest.txt') }}

      - name: Install emsdk
        run: |
          if [ ! -d "$HOME/emsdk" ]; then
            git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          cd "$HOME/emsdk"
          ./emsdk install 3.1.51
          ./emsdk activate 3.1.51

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build & test
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          export EMSDK_PATH="$HOME/emsdk"
          npm test

      - name: Publish package
        if: success() && steps.version_check.outputs.changed == 'true'
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          npm publish --provenance
