name: Release

on:
  push:
    branches:
      - master
    paths:
      - 'package.json'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Check version bump
        id: version_check
        run: |
          PREV=$(git show HEAD~1:package.json | jq -r '.version' 2>/dev/null || echo "0.0.0")
          CURR=$(jq -r '.version' package.json)
          echo "previous=$PREV"
          echo "current=$CURR"
          if [ "$PREV" != "$CURR" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Cache emsdk
        uses: actions/cache@v5
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('emsdk_manifest.txt') }}

      - name: Install emsdk
        run: |
          if [ ! -d "$HOME/emsdk" ]; then
            git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          cd "$HOME/emsdk"
          ./emsdk install $(cat "$GITHUB_WORKSPACE/emsdk_manifest.txt")
          ./emsdk activate $(cat "$GITHUB_WORKSPACE/emsdk_manifest.txt")

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm >= 11.5.1; the npm bundled with
      # node 20 (10.x) has no OIDC support and fails with ENEEDAUTH.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install deps
        run: npm ci

      - name: Build & test
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          export EMSDK_PATH="$HOME/emsdk"
          npm test

      # The published package ships both wasm variants; build KOKKOS after
      # the serial build so dist/ contains dist/cpp/lammps-kokkos.js too.
      - name: Build & test KOKKOS variant
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          export EMSDK_PATH="$HOME/emsdk"
          npm run test:kokkos

      # No emsdk_env sourcing here: it would put emsdk's bundled (old) npm
      # first on PATH, and publishing only needs the already-built dist/.
      - name: Publish package
        if: success() && steps.version_check.outputs.changed == 'true'
        run: npm publish --provenance
        env:
          # setup-node's registry-url writes an .npmrc referencing this
          # variable; it must exist (empty) for OIDC publishing to proceed.
          NODE_AUTH_TOKEN: ""
