name: Release

on:
  push:
    branches:
      - master
    paths:
      - 'package.json'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      # Compare against the registry (not HEAD~1) so a failed publish is
      # retried on the next push — or via workflow_dispatch — instead of
      # being skipped as "no version change".
      - name: Check version against npm registry
        id: version_check
        run: |
          PUBLISHED=$(npm view lammps.js version 2>/dev/null || echo "0.0.0")
          CURR=$(jq -r '.version' package.json)
          echo "published=$PUBLISHED"
          echo "current=$CURR"
          if [ "$PUBLISHED" != "$CURR" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Cache emsdk
        uses: actions/cache@v5
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('emsdk_manifest.txt') }}

      - name: Install emsdk
        run: |
          if [ ! -d "$HOME/emsdk" ]; then
            git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          cd "$HOME/emsdk"
          ./emsdk install $(cat "$GITHUB_WORKSPACE/emsdk_manifest.txt")
          ./emsdk activate $(cat "$GITHUB_WORKSPACE/emsdk_manifest.txt")

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm >= 11.5.1; the npm bundled with
      # node 20 (10.x) has no OIDC support and fails with ENEEDAUTH. Pin to
      # the 11.x line: npm@latest is now 12.x, which requires node >= 22 and
      # aborts on this node 20 runner (EBADENGINE).
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11

      - name: Install deps
        run: npm ci

      - name: Build & test
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          export EMSDK_PATH="$HOME/emsdk"
          npm test

      # The published package ships all wasm variants; build KOKKOS and the
      # atomify (full LAMMPS package set) flavor after the serial build so
      # dist/ contains dist/cpp/lammps-kokkos.js and dist/cpp/lammps-atomify.js
      # too — verify-pack (prepublishOnly) refuses to publish without them.
      - name: Build & test KOKKOS variant
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          export EMSDK_PATH="$HOME/emsdk"
          npm run test:kokkos

      - name: Build & test atomify variant
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          export EMSDK_PATH="$HOME/emsdk"
          npm run test:atomify

      # No emsdk_env sourcing here: it would put emsdk's bundled (old) npm
      # first on PATH, and publishing only needs the already-built dist/.
      - name: Publish package
        if: success() && steps.version_check.outputs.changed == 'true'
        run: npm publish --provenance
        env:
          # setup-node's registry-url writes an .npmrc referencing this
          # variable; it must exist (empty) for OIDC publishing to proceed.
          NODE_AUTH_TOKEN: ""
