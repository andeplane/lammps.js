name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache emsdk
        uses: actions/cache@v5
        with:
          path: ~/emsdk
          key: emsdk-${{ runner.os }}-${{ hashFiles('emsdk_manifest.txt') }}

      - name: Install emsdk
        run: |
          if [ ! -d "$HOME/emsdk" ]; then
            git clone https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          fi
          cd "$HOME/emsdk"
          ./emsdk install "$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/emsdk_manifest.txt")"
          ./emsdk activate "$(tr -d '[:space:]' < "$GITHUB_WORKSPACE/emsdk_manifest.txt")"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build lammps.js (the demo links the local package)
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          export EMSDK_PATH="$HOME/emsdk"
          npm ci
          npm run build

      - name: Build demo
        run: |
          cd examples/pages
          npm ci
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: examples/pages/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
